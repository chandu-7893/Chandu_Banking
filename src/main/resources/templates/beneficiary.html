<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Beneficiaries | Chandu Bank</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', sans-serif;
		}

		body {
			background: #0f172a;
			color: white;
			padding: 30px;
		}

		.container {
			max-width: 1200px;
			margin: auto;
		}

		.header {
			background: linear-gradient(135deg, #1e40af, #2563eb);
			padding: 30px;
			border-radius: 20px;
			margin-bottom: 25px;
		}

		.header h1 {
			font-size: 32px;
			margin-bottom: 10px;
		}

		.grid {
			display: grid;
			grid-template-columns: 1fr 2fr;
			gap: 25px;
		}

		.card {
			background: #1e293b;
			padding: 25px;
			border-radius: 20px;
			box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
		}

		.card h2 {
			margin-bottom: 20px;
			color: #38bdf8;
		}

		input {
			width: 100%;
			padding: 12px;
			margin-bottom: 15px;
			border: none;
			border-radius: 10px;
			background: #334155;
			color: white;
		}

		button {
			width: 100%;
			padding: 12px;
			border: none;
			border-radius: 10px;
			background: #2563eb;
			color: white;
			font-size: 16px;
			cursor: pointer;
		}

		button:hover {
			background: #1d4ed8;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th {
			background: #334155;
			padding: 15px;
		}

		td {
			padding: 15px;
			border-bottom: 1px solid #475569;
			text-align: center;
		}

		.delete-btn {
			background: #dc2626;
			padding: 8px 15px;
			border-radius: 8px;
			text-decoration: none;
			color: white;
		}

		.delete-btn:hover {
			background: #b91c1c;
		}

		.dashboard-btn {
			display: inline-block;
			margin-top: 20px;
			padding: 12px 20px;
			background: #16a34a;
			color: white;
			text-decoration: none;
			border-radius: 10px;
		}

		.dashboard-btn:hover {
			background: #15803d;
		}

		@media(max-width:768px) {

			.grid {
				grid-template-columns: 1fr;
			}

		}
	</style>
</head>

<body>

	<div class="container">

		<div class="header">
			<h1>👥 Beneficiaries</h1>
			<p>Manage your saved beneficiaries for quick transfers</p>
		</div>

		<div class="grid">

			<!-- Add Beneficiary -->

			<div class="card">

				<h2>Add Beneficiary</h2>

				<form action="/add-beneficiary" method="post">

					<input type="text" name="name" placeholder="Beneficiary Name" required>

					<input type="text" name="accountNumber" placeholder="Account Number" required>

					<input type="text" name="bankName" placeholder="Bank Name" required>

					<button type="submit">
						Add Beneficiary
					</button>

				</form>

				<a href="/dashboard" class="dashboard-btn">
					⬅ Dashboard
				</a>

			</div>

			<!-- Beneficiary List -->

			<div class="card">

				<h2>Saved Beneficiaries</h2>

				<table>

					<thead>

						<tr>
							<th>Name</th>
							<th>Account Number</th>
							<th>Bank</th>
							<th>Action</th>
						</tr>

					</thead>

					<tbody>

						<tr th:each="b : ${beneficiaries}">

							<td th:text="${b.name}"></td>

							<td th:text="${b.accountNumber}"></td>

							<td th:text="${b.bankName}"></td>

							<td>

								<a th:href="@{/delete-beneficiary/{id}(id=${b.id})}" class="delete-btn">

									Delete

								</a>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>

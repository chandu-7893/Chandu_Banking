<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>My Loans | Chandu Bank</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', sans-serif;
		}

		body {
			background: #0f172a;
			min-height: 100vh;
			padding: 30px;
			color: white;
		}

		.container {
			max-width: 1200px;
			margin: auto;
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 30px;
		}

		.header h1 {
			font-size: 35px;
		}

		.btn {
			padding: 12px 20px;
			text-decoration: none;
			color: white;
			border-radius: 10px;
			font-weight: bold;
		}

		.dashboard {
			background: #2563eb;
		}

		.apply {
			background: #22c55e;
		}

		.dashboard:hover {
			background: #1d4ed8;
		}

		.apply:hover {
			background: #16a34a;
		}

		.loan-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
			gap: 25px;
		}

		.loan-card {
			background: #1e293b;
			padding: 25px;
			border-radius: 20px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
		}

		.loan-card h2 {
			margin-bottom: 15px;
			color: #38bdf8;
		}

		.info {
			margin-bottom: 10px;
			font-size: 16px;
		}

		.status {
			padding: 8px 15px;
			border-radius: 30px;
			font-weight: bold;
			display: inline-block;
			margin-top: 15px;
		}

		.pending {
			background: #f59e0b;
			color: white;
		}

		.approved {
			background: #22c55e;
			color: white;
		}

		.rejected {
			background: #ef4444;
			color: white;
		}

		.empty {
			background: #1e293b;
			padding: 40px;
			border-radius: 20px;
			text-align: center;
			font-size: 20px;
		}
	</style>
</head>

<body>

	<div class="container">

		<div class="header">

			<h1>🏦 My Loans</h1>

			<div>

				<a href="/dashboard" class="btn dashboard">
					Dashboard
				</a>

				<a href="/loan" class="btn apply">
					Apply New Loan
				</a>

			</div>

		</div>

		<div th:if="${#lists.isEmpty(loans)}" class="empty">

			No loan applications found.

		</div>

		<div class="loan-grid">

			<div class="loan-card" th:each="loan : ${loans}">

				<h2>
					Loan #<span th:text="${loan.id}"></span>
				</h2>

				<div class="info">
					💰 Amount:
					₹ <span th:text="${loan.amount}"></span>
				</div>

				<div class="info">
					📅 Tenure:
					<span th:text="${loan.tenure}"></span> Years
				</div>

				<div class="info">
					📈 Interest Rate:
					<span th:text="${loan.interestRate}"></span>%
				</div>

				<div class="info">
					📋 Status:
				</div>

				<span th:if="${loan.status=='PENDING'}" class="status pending">
					PENDING
				</span>

				<span th:if="${loan.status=='APPROVED'}" class="status approved">
					APPROVED
				</span>

				<span th:if="${loan.status=='REJECTED'}" class="status rejected">
					REJECTED
				</span>

			</div>

		</div>

	</div>

</body>

</html>

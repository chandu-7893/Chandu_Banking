<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandu Bank Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#0ea5e9);
}

.login-card{
    width:450px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:25px;
    background:linear-gradient(135deg,#06b6d4,#0f766e);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

.logo h1{
    margin-top:20px;
    color:#0f172a;
}

.logo p{
    color:#64748b;
}

.error{
    text-align:center;
    color:red;
    font-weight:bold;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:1px solid #d1d5db;
    border-radius:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#0891b2,#0e7490);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.register{
    text-align:center;
    margin-top:25px;
}

.register a{
    text-decoration:none;
    color:#0284c7;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="login-card">

    <div class="logo">
        <div class="logo-icon">₹</div>
        <h1>Chandu Bank</h1>
        <p>Secure Net Banking Login</p>
    </div>

    <div class="error" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form action="/login" method="post">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login Securely
        </button>

    </form>

    <div class="register">
        New customer?
        <a href="/register">Create Account</a>
    </div>

</div>

</body>
</html>

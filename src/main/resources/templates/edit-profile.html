
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile | Chandu Bank</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #1e3a8a
    );
    padding:20px;
}

.edit-container{
    width:100%;
    max-width:650px;
}

.edit-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:40px;
    box-shadow:0 25px 60px rgba(0,0,0,.4);
}

.header{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.header h2{
    font-size:30px;
    margin-bottom:10px;
}

.header p{
    color:#cbd5e1;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:15px;
    outline:none;
}

.form-group input::placeholder{
    color:#cbd5e1;
}

.form-group input:focus{
    border:1px solid #60a5fa;
}

.update-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.update-btn:hover{
    transform:translateY(-2px);
}

.success{
    margin-top:20px;
    padding:12px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
}

.error{
    margin-top:20px;
    padding:12px;
    border-radius:10px;
    background:#fee2e2;
    color:#991b1b;
    text-align:center;
}

.actions{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    color:white;
    font-weight:600;
}

.profile-btn{
    background:#7c3aed;
}

.dashboard-btn{
    background:#2563eb;
}

.profile-btn:hover{
    background:#6d28d9;
}

.dashboard-btn:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<div class="edit-container">

    <div class="edit-card">

        <div class="header">
            <h2>✏️ Edit Profile</h2>
            <p>Update your personal information</p>
        </div>

        <form th:action="@{/update-profile}" method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       name="fullName"
                       th:value="${user.fullName}"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       th:value="${user.email}"
                       required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text"
                       name="phone"
                       th:value="${user.phone}"
                       required>
            </div>

            <button type="submit" class="update-btn">
                💾 Save Changes
            </button>

        </form>

        <div th:if="${success}" class="success">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="error">
            <span th:text="${error}"></span>
        </div>

        <div class="actions">

            <a href="/profile" class="btn profile-btn">
                👤 My Profile
            </a>

            <a href="/dashboard" class="btn dashboard-btn">
                🏠 Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>

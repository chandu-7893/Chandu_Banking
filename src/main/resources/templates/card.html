
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Virtual Debit Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    text-align:center;
}

.title{
    color:white;
    font-size:42px;
    font-weight:700;
    margin-bottom:35px;
}

.card{
    width:100%;
    max-width:600px;
    height:350px;
    margin:auto;
    border-radius:28px;
    padding:30px;
    position:relative;
    overflow:hidden;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 20px 50px rgba(0,0,0,.45);
}

.card::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-120px;
    right:-120px;
}

.card::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.05);
    border-radius:50%;
    bottom:-100px;
    left:-80px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
}

.bank{
    color:white;
    font-size:30px;
    font-weight:800;
}

.type{
    color:#facc15;
    font-size:18px;
    font-weight:700;
}

.chip-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:40px;
    position:relative;
    z-index:2;
}

.chip{
    width:75px;
    height:55px;
    border-radius:10px;
    background:linear-gradient(135deg,#fde047,#f59e0b);
}

.contactless{
    color:white;
    font-size:30px;
}

.card-number{
    margin-top:40px;
    color:white;
    font-size:30px;
    font-weight:700;
    letter-spacing:3px;
    text-align:left;
    position:relative;
    z-index:2;
}

.footer{
    position:absolute;
    left:30px;
    right:30px;
    bottom:30px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    z-index:2;
}

.label{
    color:#cbd5e1;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:6px;
}

.value{
    color:white;
    font-size:20px;
    font-weight:700;
}

.user-name{
    color:white;
    font-size:22px;
    font-weight:700;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:14px 28px;
    border-radius:12px;
    margin:8px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

@media(max-width:600px){

.title{
    font-size:28px;
}

.card{
    height:auto;
    min-height:320px;
    padding:20px;
}

.bank{
    font-size:22px;
}

.type{
    font-size:14px;
}

.card-number{
    font-size:18px;
    letter-spacing:1px;
    margin-top:30px;
}

.footer{
    position:static;
    margin-top:35px;
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}

.user-name{
    font-size:16px;
}

.value{
    font-size:15px;
}

}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">💳 Virtual Debit Card</h1>

    <div class="card">

        <div class="header">
            <div class="bank">CHANDU BANK</div>
            <div class="type">VISA SIGNATURE</div>
        </div>

        <div class="chip-row">
            <div class="chip"></div>
            <div class="contactless">📶</div>
        </div>

        <div class="card-number"
             th:text="${user.cardNumber}">
             5245 1234 5678 9876
        </div>

        <div class="footer">

            <div>
                <div class="label">CARD HOLDER</div>
                <div class="user-name"
                     th:text="${user.fullName}">
                     CHANDU REDDY
                </div>
            </div>

            <div>
                <div class="label">VALID THRU</div>
                <div class="value"
                     th:text="${user.expiryDate}">
                     12/31
                </div>
            </div>

            <div>
                <div class="label">CVV</div>
                <div class="value"
                     th:text="${user.cvv}">
                     123
                </div>
            </div>

        </div>

    </div>

    <div class="buttons">
        <a th:href="@{/dashboard}" class="btn">Dashboard</a>
        <a th:href="@{/profile}" class="btn">Profile</a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Admin Loan Management | Chandu Bank</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', sans-serif;
		}

		body {
			background: #0f172a;
			color: white;
			min-height: 100vh;
			padding: 30px;
		}

		.container {
			max-width: 1400px;
			margin: auto;
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 30px;
		}

		.header h1 {
			font-size: 35px;
		}

		.dashboard-btn {
			background: #2563eb;
			color: white;
			padding: 12px 20px;
			text-decoration: none;
			border-radius: 10px;
			font-weight: bold;
		}

		.dashboard-btn:hover {
			background: #1d4ed8;
		}

		.stats {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.stat-card {
			background: #1e293b;
			padding: 25px;
			border-radius: 15px;
			text-align: center;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
		}

		.stat-card h3 {
			color: #94a3b8;
			margin-bottom: 10px;
		}

		.stat-card h1 {
			font-size: 35px;
			color: #38bdf8;
		}

		.table-container {
			background: #1e293b;
			padding: 25px;
			border-radius: 20px;
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th {
			background: #334155;
			padding: 15px;
			text-align: left;
		}

		td {
			padding: 15px;
			border-bottom: 1px solid #475569;
		}

		.pending {
			background: #f59e0b;
			padding: 6px 12px;
			border-radius: 20px;
			font-weight: bold;
		}

		.approved {
			background: #22c55e;
			padding: 6px 12px;
			border-radius: 20px;
			font-weight: bold;
		}

		.rejected {
			background: #ef4444;
			padding: 6px 12px;
			border-radius: 20px;
			font-weight: bold;
		}

		.btn {
			padding: 8px 15px;
			text-decoration: none;
			border-radius: 8px;
			font-weight: bold;
			margin-right: 5px;
			color: white;
		}

		.approve-btn {
			background: #22c55e;
		}

		.reject-btn {
			background: #ef4444;
		}

		.approve-btn:hover {
			background: #16a34a;
		}

		.reject-btn:hover {
			background: #dc2626;
		}
	</style>

</head>

<body>

	<div class="container">

		<div class="header">

			<h1>🏦 Admin Loan Dashboard</h1>

			<a href="/admin" class="dashboard-btn">
				Back To Admin
			</a>

		</div>

		<div class="stats">

			<div class="stat-card">
				<h3>Total Applications</h3>
				<h1 th:text="${#lists.size(loans)}">0</h1>
			</div>

			<div class="stat-card">
				<h3>Pending Loans</h3>
				<h1 th:text="${loans.?[status=='PENDING'].size()}">0</h1>
			</div>

			<div class="stat-card">
				<h3>Approved Loans</h3>
				<h1 th:text="${loans.?[status=='APPROVED'].size()}">0</h1>
			</div>

			<div class="stat-card">
				<h3>Rejected Loans</h3>
				<h1 th:text="${loans.?[status=='REJECTED'].size()}">0</h1>
			</div>

		</div>

		<div class="table-container">

			<h2 style="margin-bottom:20px;">
				📋 Loan Applications
			</h2>

			<table>

				<thead>
					<tr>
						<th>ID</th>
						<th>Username</th>
						<th>Amount</th>
						<th>Tenure</th>
						<th>Interest</th>
						<th>Status</th>
						<th>Action</th>
					</tr>
				</thead>

				<tbody>

					<tr th:each="loan : ${loans}">

						<td th:text="${loan.id}"></td>

						<td th:text="${loan.username}"></td>

						<td>
							₹ <span th:text="${loan.amount}"></span>
						</td>

						<td>
							<span th:text="${loan.tenure}"></span> Years
						</td>

						<td>
							<span th:text="${loan.interestRate}"></span>%
						</td>

						<td>

							<span th:if="${loan.status=='PENDING'}" class="pending">
								PENDING
							</span>

							<span th:if="${loan.status=='APPROVED'}" class="approved">
								APPROVED
							</span>

							<span th:if="${loan.status=='REJECTED'}" class="rejected">
								REJECTED
							</span>

						</td>

						<td>

							<a th:if="${loan.status=='PENDING'}" th:href="@{'/approve-loan/' + ${loan.id}}"
								class="btn approve-btn">
								Approve
							</a>

							<a th:if="${loan.status=='PENDING'}" th:href="@{'/reject-loan/' + ${loan.id}}"
								class="btn reject-btn">
								Reject
							</a>

						</td>

					</tr>

				</tbody>

			</table>

		</div>

	</div>

</body>

</html>
